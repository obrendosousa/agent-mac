name: Chappie
options:
  bundleIdPrefix: ai.chappie
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO

packages:
  ChappieKit:
    path: ../shared/ChappieKit
  Swabble:
    path: ../../Swabble

schemes:
  Chappie:
    shared: true
    build:
      targets:
        Chappie: all
    test:
      targets:
        - ChappieTests
        - ChappieLogicTests
  ChappieLogicTests:
    shared: true
    build:
      targets:
        ChappieLogicTests: all
    test:
      targets:
        - ChappieLogicTests

targets:
  Chappie:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
    dependencies:
      - target: ChappieShareExtension
        embed: true
      - target: ChappieActivityWidget
        embed: true
      - target: ChappieWatchApp
      - package: ChappieKit
      - package: ChappieKit
        product: ChappieChatUI
      - package: ChappieKit
        product: ChappieProtocol
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    preBuildScripts:
      - name: SwiftFormat (lint)
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftformat >/dev/null 2>&1; then
            echo "error: swiftformat not found (brew install swiftformat)" >&2
            exit 1
          fi
          swiftformat --lint --config "$SRCROOT/../../.swiftformat" \
            --filelist "$SRCROOT/SwiftSources.input.xcfilelist"
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftlint >/dev/null 2>&1; then
            echo "error: swiftlint not found (brew install swiftlint)" >&2
            exit 1
          fi
          swiftlint lint --config "$SRCROOT/.swiftlint.yml" --use-script-input-file-lists
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Sources/Chappie.entitlements
        CODE_SIGN_STYLE: "$(CHAPPIE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(CHAPPIE_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(CHAPPIE_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(CHAPPIE_APP_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
      configs:
        Debug:
          CHAPPIE_PUSH_TRANSPORT: direct
          CHAPPIE_PUSH_DISTRIBUTION: local
          CHAPPIE_PUSH_RELAY_BASE_URL: ""
          CHAPPIE_PUSH_APNS_ENVIRONMENT: sandbox
        Release:
          CHAPPIE_PUSH_TRANSPORT: direct
          CHAPPIE_PUSH_DISTRIBUTION: local
          CHAPPIE_PUSH_RELAY_BASE_URL: ""
          CHAPPIE_PUSH_APNS_ENVIRONMENT: production
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Chappie
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: ai.chappie.ios
            CFBundleURLSchemes:
              - chappie
        CFBundleShortVersionString: "$(CHAPPIE_MARKETING_VERSION)"
        CFBundleVersion: "$(CHAPPIE_BUILD_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - ai.chappie.ios.bgrefresh
        NSLocalNetworkUsageDescription: Chappie discovers and connects to your Chappie gateway on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSBonjourServices:
          - _chappie-gw._tcp
        NSCameraUsageDescription: Chappie can capture photos or short video clips when requested via the gateway.
        NSLocationWhenInUseUsageDescription: Chappie uses your location when you allow location sharing.
        NSLocationAlwaysAndWhenInUseUsageDescription: Chappie can share your location in the background when you enable Always.
        NSMicrophoneUsageDescription: Chappie needs microphone access for voice wake.
        NSMotionUsageDescription: Chappie may use motion data to support device-aware interactions and automations.
        NSPhotoLibraryUsageDescription: Chappie needs photo library access when you choose existing photos to share with your assistant.
        NSSpeechRecognitionUsageDescription: Chappie uses on-device speech recognition for voice wake.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        ChappiePushTransport: "$(CHAPPIE_PUSH_TRANSPORT)"
        ChappiePushDistribution: "$(CHAPPIE_PUSH_DISTRIBUTION)"
        ChappiePushRelayBaseURL: "$(CHAPPIE_PUSH_RELAY_BASE_URL)"
        ChappiePushAPNsEnvironment: "$(CHAPPIE_PUSH_APNS_ENVIRONMENT)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  ChappieShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ShareExtension
    dependencies:
      - package: ChappieKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(CHAPPIE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(CHAPPIE_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(CHAPPIE_SHARE_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(CHAPPIE_SHARE_PROFILE)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Chappie Share
        CFBundleShortVersionString: "$(CHAPPIE_MARKETING_VERSION)"
        CFBundleVersion: "$(CHAPPIE_BUILD_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1

  ChappieActivityWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ActivityWidget
      - path: Sources/LiveActivity/ChappieActivityAttributes.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(CHAPPIE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(CHAPPIE_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(CHAPPIE_ACTIVITY_WIDGET_BUNDLE_ID)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
    info:
      path: ActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: Chappie Activity
        CFBundleShortVersionString: "$(CHAPPIE_MARKETING_VERSION)"
        CFBundleVersion: "$(CHAPPIE_BUILD_VERSION)"
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  ChappieWatchApp:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
    dependencies:
      - target: ChappieWatchExtension
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(CHAPPIE_WATCH_APP_BUNDLE_ID)"
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Chappie
        CFBundleShortVersionString: "$(CHAPPIE_MARKETING_VERSION)"
        CFBundleVersion: "$(CHAPPIE_BUILD_VERSION)"
        WKCompanionAppBundleIdentifier: "$(CHAPPIE_APP_BUNDLE_ID)"
        WKWatchKitApp: true

  ChappieWatchExtension:
    type: watchkit2-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchExtension/Sources
    dependencies:
      - sdk: AppIntents.framework
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(CHAPPIE_WATCH_EXTENSION_BUNDLE_ID)"
    info:
      path: WatchExtension/Info.plist
      properties:
        CFBundleDisplayName: Chappie
        CFBundleShortVersionString: "$(CHAPPIE_MARKETING_VERSION)"
        CFBundleVersion: "$(CHAPPIE_BUILD_VERSION)"
        NSExtension:
          NSExtensionAttributes:
            WKAppBundleIdentifier: "$(CHAPPIE_WATCH_APP_BUNDLE_ID)"
          NSExtensionPointIdentifier: com.apple.watchkit

  ChappieTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests
        excludes:
          - Logic
    dependencies:
      - target: Chappie
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(CHAPPIE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(CHAPPIE_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.chappie.ios.tests
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Chappie.app/Chappie"
        BUNDLE_LOADER: "$(TEST_HOST)"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: ChappieTests
        CFBundleShortVersionString: "$(CHAPPIE_MARKETING_VERSION)"
        CFBundleVersion: "$(CHAPPIE_BUILD_VERSION)"

  ChappieLogicTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests/Logic
    dependencies:
      - package: ChappieKit
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(CHAPPIE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(CHAPPIE_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.chappie.ios.logic-tests
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: ChappieLogicTests
        CFBundleShortVersionString: "$(CHAPPIE_MARKETING_VERSION)"
        CFBundleVersion: "$(CHAPPIE_BUILD_VERSION)"
